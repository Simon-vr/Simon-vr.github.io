<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map - simon-vr</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    (function () {
      const savedTheme = localStorage.getItem('theme');
      document.documentElement.setAttribute('data-theme', savedTheme || 'dark');
    })();
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg-color);
    }

    #mapRoot {
      position: relative;
      z-index: 0; /* 确保地图在最下层 */
      width: 90%;
      max-width: 1100px;
      height: 650px;
      min-height: 520px;
      margin: 2rem auto;
      /* 已删除所有圆角、溢出、边框 */
    }

    #mapCanvas {
      width: 100%;
      height: 100%;
      position: relative;
      z-index: 0; /* 地图画布层级最低，不遮挡任何元素 */
    }

    .map-panel {
      max-width: 1280px;
      margin: 0 auto;
      padding: 1.2rem 1rem 2rem;
      position: relative;
      z-index: 10; /* 面板内容在地图上方 */
    }

    .map-card {
      background: var(--panel-color);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
      padding: 1rem;
      margin-bottom: 1rem;
    }

    .map-card h1 {
      font-family: var(--sans-font);
      font-size: clamp(1.2rem, 2vw, 1.7rem);
      margin-bottom: 0.5rem;
    }

    .map-card p {
      color: var(--text-soft);
    }

    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      background: var(--panel-strong) !important;
      color: var(--text-color) !important;
    }
  </style>
</head>
<body>
  <div class="map-panel">
    <div class="map-card">
      <p class="kicker" data-i18n="nav.map">Map</p>
      <h1 id="mapTitle"></h1>
      <p></p>
    </div>
    <div id="mapRoot">
      <div id="mapCanvas"></div>
    </div>
  </div>

  <script src="js/core/i18n.js"></script>
  <script src="js/modules/header.js"></script>
  <script src="js/modules/theme.js"></script>
  <script>
    async function initMapPage() {
      const response = await fetch('data/map-data.json');
      if (!response.ok) {
        throw new Error('Failed to load map data');
      }

      const mapData = await response.json();
      const map = L.map('mapCanvas').setView(mapData.center || [30, 110], mapData.zoom || 2);

      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png', {
        attribution: '&copy; Carto',
        maxZoom: 7, // 限制最大放大级别，细节更少、请求更少
        minZoom: 2,  // 最小缩放级别
        tileSize: 256, // 标准瓦片大小，兼容性最好
        zoomOffset: 0
      }).addTo(map);

      const points = [];
      (mapData.points || []).forEach((item) => {
        const [lat, lng, name, desc] = item;
        points.push([lat, lng]);

        const hitArea = L.circleMarker([lat, lng], {
          radius: 20,
          fillOpacity: 0,
          opacity: 0
        }).addTo(map);

        L.circleMarker([lat, lng], {
          radius: 3,
          fillColor: '#00FFFF',
          color: '#00FFFF',
          fillOpacity: 1,
          weight: 1
        }).addTo(map);

        hitArea.bindPopup(`
          <h3 style="color:#00FFFF; margin:0;">${name}</h3>
          <p style="margin:5px 0 0; font-size:14px;">${desc}</p>
        `);
      });

      const links = [];
      (mapData.links || []).forEach((link) => {
        const [from, to] = link;
        const fromPoint = mapData.points.find(p => p[2] === from);
        const toPoint = mapData.points.find(p => p[2] === to);
        if (fromPoint && toPoint) {
          links.push([[fromPoint[0], fromPoint[1]], [toPoint[0], toPoint[1]]]);
        }
        if (links.length > 0) {
        links.forEach(([from, to]) => {
          L.polyline([from, to], { color: '#8fd8ac', weight: 0.8, opacity: 0.75 }).addTo(map);
        });
        }
      });
      

      document.getElementById('mapTitle').textContent = mapData.title || '旅行轨迹地图';
    }

    document.addEventListener('DOMContentLoaded', () => {
      initMapPage().catch((error) => {
        console.error(error);
        const mapCanvas = document.getElementById('mapCanvas');
        if (mapCanvas) {
          mapCanvas.innerHTML = '<div class="error">地图加载失败，请稍后再试。</div>';
        }
      });
    });
  </script>
</body>
</html>
