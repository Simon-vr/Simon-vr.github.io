<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share - simon-vr</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    // 在页面加载前立即应用主题，避免闪烁
    (function() {
      const savedTheme = localStorage.getItem('theme');
      let theme = savedTheme;
      if (!theme) {
        // 首次访问默认夜间
        theme = 'dark';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <!-- 导航栏由 header.js 动态注入 -->

  <div class="container">
    <div class="page-header">
      <h1 data-i18n="page.share.title">Curated</h1>
      <p data-i18n="page.share.subtitle">转载与精选。记录值得反复阅读和传播的内容。</p>
    </div>
    <div id="blogList" class="blog-list"></div>
  </div>

  <!-- 按依赖顺序加载脚本 -->
  <script src="js/core/utils.js"></script>
  <script src="js/core/i18n.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/modules/header.js"></script>
  <script src="js/modules/theme.js"></script>
  <script src="js/modules/list.js"></script>
</body>
</html>
