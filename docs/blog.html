<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 第一步：配置 MathJax（必须在引入库之前） -->
  <script type="text/javascript">
      // 全局配置 MathJax
      window.MathJax = {
          tex: {
              inlineMath: [['$', '$']],       // 行内公式：$公式$
              displayMath: [['$$', '$$']],     // 块级公式：$$公式$$
              processEscapes: true,            // 允许用 \$ 表示普通美元符号
              packages: {'[+]': ['base']}      // 加载基础包，确保核心功能
          },
          svg: {
              fontCache: 'global'              // 缓存字体，提升加载速度
          },
          startup: {
              typeset: false                   // 页面加载后自动渲染公式
          }
      };
  </script>
  <!-- 第二步：引入 MathJax 核心库（稳定版本，CDN 地址可靠） -->
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js" id="MathJax-script"></script>
  <title>Entry - simon-vr</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // 在页面加载前立即应用主题，避免闪烁
    (function() {
      const savedTheme = localStorage.getItem('theme');
      let theme = savedTheme;
      if (!theme) {
        // 首次访问默认夜间
        theme = 'dark';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <!-- 导航栏由 header.js 动态注入 -->

  <div class="container">
    <div class="blog-detail">
      <a href="javascript:history.back()" class="back-link" data-i18n="detail.back">← 返回</a>
      <div class="blog-detail-header">
        <div class="blog-header-top">
          <h1 id="blogTitle">加载中...</h1>
          <!--
          <div class="lang-switcher" id="langSwitcher" style="display: none;">
            <button class="lang-btn active" data-lang="cn" data-i18n="detail.langCn">中文</button>
            <button class="lang-btn" data-lang="en" title="powered by ChatGPT" data-i18n="detail.langEn">English</button>
          </div>
          -->
        </div>
        <div class="blog-meta-row">
          <div class="date" id="blogDate"></div>
          <div class="tag" id="blogTag"></div>
        </div>
      </div>
      <div class="blog-content" id="blogContent">
        <div class="loading">加载中...</div>
      </div>
      <div class="claimer" data-i18n="detail.claimerCn" data-lang-block="cn">
        以上内容仅代表个人阶段性观点。转载内容会尽量保留出处，并仅用于学习与分享。
      </div>
      <div class="claimer" data-i18n="detail.claimerEn" data-lang-block="en">
        Writing is an open loop. Feel free to challenge, supplement, or correct.
      </div>
      <div class="comments-section">
        <h2 data-i18n="detail.discussion">Discussion</h2>
        <div id="commentsRoot"></div>
      </div>
    </div>
  </div>

  <!-- 按依赖顺序加载脚本 -->
  <script src="js/core/utils.js"></script>
  <script src="js/core/i18n.js"></script>
  <script src="js/core/state.js"></script>
  <script src="js/core/site-config.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/modules/header.js"></script>
  <script src="js/modules/theme.js"></script>
  <script src="js/modules/comments.js"></script>
  <script src="js/modules/detail.js"></script>
</body>
</html>
